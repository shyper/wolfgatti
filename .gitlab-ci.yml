# Builds the Wolfgatti Online image and pushes it to this project's GitLab Container Registry.
#
# - Merge requests: run the checks and build the image (no push).
# - Default branch: push :<short-sha> and :latest.
# - Git tags:       push :<tag> as well.
#
# Only original Wolfgatti assets are included in the release image.
# Docker-in-Docker needs a runner with `privileged = true` (GitLab.com shared runners have it).

stages:
  - test
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  NPM_CONFIG_CACHE: $CI_PROJECT_DIR/.npm

checks:
  stage: test
  image: node:24-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --no-audit --no-fund
    - npm test
    - npm run typecheck
    - npm run i18n:check
    - npm run assets:check

.docker:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: /certs/client
    # Registry cache keeps every stage (dependencies, build), not just the final image.
    CACHE_REF: $CI_REGISTRY_IMAGE:buildcache
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # buildx cannot use the dind TLS settings from the environment directly; it needs a context.
    - docker context create dind
    - docker buildx create --use --name ci-builder --driver docker-container dind

build:
  extends: .docker
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - docker buildx build --cache-from "type=registry,ref=$CACHE_REF" .

build-and-push:
  extends: .docker
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - TAGS="-t $IMAGE:$CI_COMMIT_SHORT_SHA"
    - if [ -n "$CI_COMMIT_TAG" ]; then TAGS="$TAGS -t $IMAGE:$CI_COMMIT_TAG"; fi
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then TAGS="$TAGS -t $IMAGE:latest"; fi
    - >
      docker buildx build
      --cache-from "type=registry,ref=$CACHE_REF"
      --cache-to "type=registry,ref=$CACHE_REF,mode=max"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      $TAGS
      --push
      .
