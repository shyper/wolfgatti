name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Application and Docker checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm
      PIP_CACHE_DIR: ${{ github.workspace }}/.work/pip-cache
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run engine and room tests
        run: npm test

      - name: Check types
        run: npm run typecheck

      - name: Check translations
        run: npm run i18n:check

      # Check committed fingerprints before the build regenerates them.
      - name: Check artwork and provenance
        run: npm run assets:check

      - name: Check image transparency
        run: |
          python3 -m venv .work/ci-python
          .work/ci-python/bin/python -m pip install -r tools/requirements-artwork.txt
          .work/ci-python/bin/python tools/check-assets.py

      - name: Build application
        run: npm run build

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: wolfgatti:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and wait for health
        run: |
          docker run --detach --name wolfgatti-ci --publish 127.0.0.1:3300:3000 wolfgatti:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3300/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo 'Container did not become healthy within 60 seconds.' >&2
          exit 1

      - name: Exercise a complete match against the container
        env:
          WOLFGATTI_TEST_URL: http://127.0.0.1:3300
        run: npm run test:smoke

      - name: Show container logs on failure
        if: failure()
        run: docker logs wolfgatti-ci 2>&1 || true

      - name: Remove test container and its anonymous volume
        if: always()
        run: docker rm --force --volumes wolfgatti-ci 2>/dev/null || true

  publish:
    name: Publish latest to GHCR
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'shyper/wolfgatti'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/shyper/wolfgatti:latest
            ghcr.io/shyper/wolfgatti:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/shyper/wolfgatti
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
